# Configuração usada pela Supabase CLI ao publicar as Funções Edge (projeto bulqqdgfrrpqquqvjjfa).
project_id = "bulqqdgfrrpqquqvjjfa"

# O agendador do banco chama esta função com um token próprio (x-agente-token), não com login de usuário.
# A função confere esse token ou o login do administrador; por isso a checagem padrão fica desligada.
[functions.balancete-agente]
verify_jwt = false
import_map = "./functions/balancete-agente/deno.json"

[functions.convite]
verify_jwt = true
import_map = "./functions/convite/deno.json"

[functions.demonstrativo-pdf]
verify_jwt = true
import_map = "./functions/demonstrativo-pdf/deno.json"

[functions.certificado]
verify_jwt = true
import_map = "./functions/certificado/deno.json"

# Notas fiscais (migração 032). fiscal-captura é chamada pelo agendador com token próprio (x-agente-token) ou pela
# tela com o login (a função confere o login e a permissão no banco); por isso a checagem padrão fica desligada.
[functions.fiscal-captura]
verify_jwt = false
import_map = "./functions/fiscal-captura/deno.json"

[functions.fiscal-certificado]
verify_jwt = true
import_map = "./functions/fiscal-certificado/deno.json"

[functions.fiscal-manifestar]
verify_jwt = true
import_map = "./functions/fiscal-manifestar/deno.json"

# Ledgra Link (migração 043): ledgra-link é chamada pela tela com o login (a função confere a permissão no banco);
# ledgra-link-webhook é chamada pelo Ledgra Link, sem login: a defesa é a assinatura do aviso, por isso a checagem
# padrão fica desligada nela.
[functions.ledgra-link]
verify_jwt = true
import_map = "./functions/ledgra-link/deno.json"

[functions.ledgra-link-webhook]
verify_jwt = false
import_map = "./functions/ledgra-link-webhook/deno.json"

# NFS-e (migração 046): nfse-emitir é chamada pela tela Contratos › Faturas com o login (a função confere a permissão no
# banco com nfse_preparar e só então reserva o nDPS com a chave de serviço). Checagem padrão de login ligada.
[functions.nfse-emitir]
verify_jwt = true
import_map = "./functions/nfse-emitir/deno.json"

# NFS-e automática (migração 052): chamada só pelo agendador (pg_cron) com o token do Vault (x-agente-token), que a
# função confere no banco; sem login de usuário, por isso a checagem padrão fica desligada.
[functions.nfse-automatica]
verify_jwt = false
import_map = "./functions/nfse-automatica/deno.json"

# Envio das faturas (migração 053): fatura-enviar é chamada pelo agendador com token próprio (x-agente-token) ou pela
# tela Contratos › Envio com o login (a função confere a permissão no banco); por isso a checagem padrão fica desligada.
# Segredos (Edge Functions › Secrets): GRAPH_TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET, GRAPH_REMETENTE,
# WHATSAPP_TOKEN, WHATSAPP_NUMERO_ID, WHATSAPP_MODELO (docs/07, seção 7.7).
[functions.fatura-enviar]
verify_jwt = false
import_map = "./functions/fatura-enviar/deno.json"
