# Publicação das Funções Edge do Supabase (projeto bulqqdgfrrpqquqvjjfa), direto do repositório.
# Roda quando um push na main mexe em supabase/functions/ ou em supabase/config.toml, e também à mão (aba Actions ›
# "Publicar Funções" › Run workflow). Antes de publicar, confere os tipos de todas as Funções; se falhar, não publica.
# Sem terminal o CLI pede confirmação: por isso o --yes. Cada Função usa o verify_jwt e o import_map definidos em supabase/config.toml.
#
# Segredo necessário (cadastrado pelo Edvaldo em GitHub › Settings › Secrets and variables › Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal do Supabase (Account › Access Tokens). Nunca no código.
name: Publicar Funções
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/funcoes.yml"]
  pull_request:
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/funcoes.yml"]
  workflow_dispatch:
concurrency:
  group: funcoes-supabase
  cancel-in-progress: false
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Conferir tipos de cada Função
        working-directory: supabase/functions
        run: |
          falhou=0
          for d in */; do
            d=${d%/}
            case "$d" in _*) continue ;; esac
            [ -f "$d/index.ts" ] || continue
            echo "::group::$d"
            (cd "$d" && deno check --config deno.json index.ts) || falhou=1
            echo "::endgroup::"
          done
          exit $falhou
  publicar:
    needs: conferir
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conferir o segredo
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings › Secrets and variables › Actions)."
            exit 1
          fi
      - name: Publicar todas as Funções
        run: supabase functions deploy --project-ref bulqqdgfrrpqquqvjjfa --use-api --yes
